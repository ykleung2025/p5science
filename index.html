<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd54a">
  <title>小小科學家探究助手：空氣的秘密</title>
  <meta name="description" content="小學五年級科學探究對話：杯子與紙巾實驗，認識空氣佔有空間。">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
  <a class="skip" href="#user-input">跳到輸入答案</a>
  <div id="app" class="app" data-step="1" data-phase="ask">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">小學五年級 · 科學探究</p>
        <h1>小小科學家探究助手</h1>
        <p class="topic">空氣的秘密</p>
      </div>
      <button type="button" id="reset" class="reset">重新開始</button>
    </header>

    <div class="workspace">
    <section id="stage" class="stage" data-scene="push" aria-labelledby="stage-caption">
      <div class="stage-view">
        <div class="lab" aria-hidden="true">
          <div class="tank">
            <div class="water"></div>
            <div class="wave"></div>
            <p class="tank-badge" id="tank-badge">垂直壓入</p>
            <span class="water-name">水</span>
            <div class="bubbles"><span></span><span></span><span></span></div>
            <div class="cup-rig">
              <div class="nudge"></div>
              <div class="cup-spin">
                <div class="glass">
                  <div class="cup-inner">
                    <div class="inner-water"></div>
                    <div class="shine"></div>
                    <div class="towel"><span>紙巾</span></div>
                    <div class="air-word">空氣</div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="table"></div>
        </div>
      </div>
      <div class="stage-copy">
        <p id="stage-kicker" class="stage-kicker">第 1 步 · 觀察</p>
        <p id="stage-caption" class="stage-caption" aria-live="polite">杯口朝下，垂直壓入水中，紙巾還是乾的。</p>
      </div>
    </section>

    <div class="dialogue">
    <section class="progress" aria-label="探究進度">
      <ol id="progress-dots"></ol>
      <p id="progress-text">第 1 步，共 6 步：觀察</p>
    </section>

    <main id="chat" class="chat" role="log" aria-live="polite" aria-relevant="additions" aria-label="探究對話"></main>

    <form id="composer" class="composer">
      <div id="options" class="options" role="group" aria-label="快捷答案"></div>
      <label for="user-input">你的答案</label>
      <input id="user-input" name="answer" type="text" maxlength="300" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入或選擇答案">
      <div class="actions">
        <button type="submit" id="send" class="send">傳送</button>
        <button type="button" id="hint" class="hint">提示</button>
      </div>
      <p id="form-status" class="status" role="status"></p>
    </form>
    </div>
    </div>
  </div>
  <noscript><p class="setup">請開啟 JavaScript，探究助手才可以對話。</p></noscript>
  <script src="js/grade.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
