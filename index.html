<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffd54a">
  <title>小小科學家探究助手：空氣的秘密</title>
  <meta name="description" content="小學五年級科學探究對話：杯子與紙巾實驗，認識空氣佔有空間。">
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
  <a class="skip" href="#user-input">跳到輸入答案</a>
  <div id="app" class="app" data-step="1" data-phase="ask">
    <header class="top">
      <div class="brand">
        <p class="eyebrow">小學五年級 · 科學探究</p>
        <h1>小小科學家探究助手</h1>
        <p class="topic">空氣的秘密</p>
      </div>
      <button type="button" id="reset" class="reset">重新開始</button>
    </header>

    <section class="progress" aria-label="探究進度">
      <ol id="progress-dots"></ol>
      <p id="progress-text">第 1 步，共 6 步：觀察</p>
    </section>

    <p class="setup">杯底塞好紙巾，杯口朝下，垂直壓入水中。傾斜杯子時，再看水裡有甚麼跑出來。</p>

    <main id="chat" class="chat" role="log" aria-live="polite" aria-relevant="additions" aria-label="探究對話"></main>

    <form id="composer" class="composer">
      <div id="options" class="options" role="group" aria-label="快捷答案"></div>
      <label for="user-input">你的答案</label>
      <input id="user-input" name="answer" type="text" maxlength="300" enterkeyhint="send" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入或選擇答案">
      <div class="actions">
        <button type="submit" id="send" class="send">傳送</button>
        <button type="button" id="hint" class="hint">提示</button>
      </div>
      <p id="form-status" class="status" role="status"></p>
    </form>
  </div>
  <noscript><p class="setup">請開啟 JavaScript，探究助手才可以對話。</p></noscript>
  <script src="js/grade.js?v=1"></script>
  <script src="js/app.js?v=1"></script>
</body>
</html>
